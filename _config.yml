# Site settings
title: "Technology crap dug up from the interwebs"
description: "Random tech finds and discoveries"
author: ""
url: "https://marduk191.github.io"
baseurl: ""

# Build settings
markdown: kramdown
permalink: /:categories/:title/
paginate: 10
paginate_path: "/blog/page:num/"

# Collections
collections:
  categories:
    output: true
    permalink: /category/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "page"

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
