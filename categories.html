---
layout: default
title: Categories
permalink: /categories/
---

<h1>Categories</h1>

<div class="categories-list">
  {% for tag in site.tags %}
    <a href="{{ '/category/' | append: tag[0] | slugify | append: '/' | relative_url }}" class="category-card">
      <h3>{{ tag[0] }}</h3>
      <span class="count">{{ tag[1].size }} posts</span>
    </a>
  {% endfor %}
</div>
